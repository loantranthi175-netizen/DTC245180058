services:
  # 1. Cơ sở dữ liệu MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: quiz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSecret@2026}
      MYSQL_DATABASE: ${DB_NAME:-quiz_db}
      MYSQL_USER: ${DB_USER:-quiz_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-QuizSecret@2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - quiz-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootSecret@2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 2. Ứng dụng Quiz (Node.js/Express + EJS)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: quiz-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-quiz_db}
      DB_USER: ${DB_USER:-quiz_user}
      DB_PASSWORD: ${DB_PASSWORD:-QuizSecret@2026}
      SESSION_SECRET: ${SESSION_SECRET:-quiz_super_secure_session_key_2026}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz-network

  # 3. Cổng vào Nginx Reverse Proxy (HTTPS tự ký + Security Headers)
  nginx:
    image: nginx:alpine
    container_name: quiz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - quiz-network

  # 4. Quản trị cơ sở dữ liệu qua giao diện Web (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: quiz-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSecret@2026}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz-network

volumes:
  mysql_data:
    name: quiz_mysql_data
  nginx_logs:
    name: quiz_nginx_logs

networks:
  quiz-network:
    name: quiz-network
    driver: bridge
