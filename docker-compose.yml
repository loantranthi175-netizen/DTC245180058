services:
  # 1. Cơ sở dữ liệu MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: quiz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSecret@2026}
      MYSQL_DATABASE: ${DB_NAME:-quiz_db}
      MYSQL_USER: ${DB_USER:-quiz_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-QuizSecret@2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - quiz-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootSecret@2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 2. Ứng dụng Quiz (Node.js/Express + EJS)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: quiz-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-quiz_db}
      DB_USER: ${DB_USER:-quiz_user}
      DB_PASSWORD: ${DB_PASSWORD:-QuizSecret@2026}
      SESSION_SECRET: ${SESSION_SECRET:-quiz_super_secure_session_key_2026}
    volumes:
      - ./app/views:/usr/src/app/views:ro
      - ./app/routes:/usr/src/app/routes:ro
      - ./app/public:/usr/src/app/public:ro
      - ./app/config:/usr/src/app/config:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz-network

  # 3. Cổng vào Nginx Reverse Proxy (HTTPS tự ký + Security Headers)
  nginx:
    image: nginx:alpine
    container_name: quiz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - quiz-network

  # 4. Quản trị cơ sở dữ liệu qua giao diện Web (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: quiz-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSecret@2026}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz-network

  # 5. Giám sát tài nguyên Containers (cAdvisor)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: quiz-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    networks:
      - quiz-network

  # 6. Giám sát Nginx Web Server (Nginx Prometheus Exporter)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: quiz-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    expose:
      - "9113"
    depends_on:
      - nginx
    networks:
      - quiz-network

  # 7. Giám sát Cơ sở dữ liệu MySQL (mysqld-exporter)
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: quiz-mysql-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=root
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-060606}
    expose:
      - "9104"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz-network

  # 8. Prometheus Server thu thập & lưu trữ Metrics
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: quiz-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    depends_on:
      - app
      - nginx-exporter
      - mysql-exporter
    networks:
      - quiz-network

  # 9. Grafana Dashboard trực quan hóa chỉ số giám sát
  grafana:
    image: grafana/grafana:10.4.2
    container_name: quiz-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - quiz-network

  # 10. Hệ thống lưu trữ Log tập trung (Loki)
  loki:
    image: grafana/loki:2.9.8
    container_name: quiz-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - quiz-network

  # 11. Thu thập và gửi Log tới Loki (Promtail)
  promtail:
    image: grafana/promtail:2.9.8
    container_name: quiz-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - nginx_logs:/var/log/nginx:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - quiz-network

volumes:
  mysql_data:
    name: quiz_mysql_data
  nginx_logs:
    name: quiz_nginx_logs
  prometheus_data:
    name: quiz_prometheus_data
  grafana_data:
    name: quiz_grafana_data
  loki_data:
    name: quiz_loki_data

networks:
  quiz-network:
    name: quiz-network
    driver: bridge
