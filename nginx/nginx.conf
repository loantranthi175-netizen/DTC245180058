events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. Ẩn thông tin phiên bản Nginx (Security Hardening)
    server_tokens off;

    # 2. Định dạng Log chi tiết chuẩn bị cho Promtail / Loki thu thập
    log_format custom_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log custom_json;
    error_log  /var/log/nginx/error.log warn;

    # 3. Tối ưu hiệu năng gửi file
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip nén dữ liệu truyền tải
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # ==============================================================================
    # HTTP Server: Cổng 80 - Tự động chuyển hướng (Redirect 301) sang HTTPS 443
    # ==============================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        location /stub_status {
            stub_status;
            access_log off;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==============================================================================
    # HTTPS Server: Cổng 443 - SSL/TLS, Security Headers & Reverse Proxy
    # ==============================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost;

        # Cấu hình SSL Certificate tự ký
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Giao thức an toàn (Bảo mật: bỏ SSLv3, TLSv1, TLSv1.1 cũ)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ==========================================================================
        # Security Headers (OWASP Best Practices)
        # ==========================================================================
        # Chống Clickjacking (Clickjacking Protection)
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Chống MIME-type Sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Bật cơ chế lọc XSS trên các trình duyệt cũ
        add_header X-XSS-Protection "1; mode=block" always;

        # Buộc trình duyệt luôn kết nối qua HTTPS (HSTS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content Security Policy (CSP)
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:;" always;

        # Kiểm soát thông tin Referrer khi chuyển hướng
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Hạn chế quyền phần cứng trình duyệt
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ==========================================================================
        # Reverse Proxy chuyển tiếp request tới Quiz App Node.js (container app:3000)
        # ==========================================================================
        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Giữ nguyên IP và Scheme thực tế của Client
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ==========================================================================
        # Endpoint kiểm tra chỉ số Nginx (Stub Status) phục vụ Prometheus Exporter
        # ==========================================================================
        location /stub_status {
            stub_status;
            access_log off;
            allow all;
        }
    }
}
